#:schema node_modules/wrangler/config-schema.json

# QA Interview Hub — Cloudflare Worker + D1 + static assets.
# One Worker serves both the website and the /api/* backend.

name = "qa-interview-hub"
main = "worker/src/index.js"
# Keep this date at or below today's date; bump it deliberately when needed.
compatibility_date = "2025-06-01"

# ---------------------------------------------------------------------------
# Static website
# index.html, css/, js/, data/, assets/, docs/, viewer.html, docs.json, ...
# are served directly from the repository root. The Worker is only invoked for
# requests that do not match a static file (e.g. /api/*).
# Non-public files are excluded through .assetsignore.
# ---------------------------------------------------------------------------
[assets]
directory = "./"
binding = "ASSETS"
not_found_handling = "none"

# ---------------------------------------------------------------------------
# Cloudflare D1 database — production
#
# Create it once with:  npx wrangler d1 create qa-interview-hub-db
# Then paste the returned database_id below (it must be a UUID, not a name).
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "qa-interview-hub-db"
database_id = "164b9201-b8bd-4f53-9750-99a84e1a7344"
# ...
# ---------------------------------------------------------------------------
# Workers AI — powers Mock Interview Mode (free tier: 10,000 Neurons/day)
#
# This binding is what makes the free path work: no API key, no billing.
# ---------------------------------------------------------------------------
[ai]
binding = "AI"

[observability.logs]
enabled = true
invocation_logs = true
persist = true
# ...
# ---------------------------------------------------------------------------
# Non-secret configuration.
#
# Secrets are NOT set here. Put them in the Worker with:
#   npx wrangler secret put OPENAI_API_KEY
# and in .dev.vars for local development (that file is gitignored).
# ---------------------------------------------------------------------------
[vars]
# --- Mock Interview: model selection -----------------------------------
# "workers-ai" uses the free AI binding above and needs no key.
# Switch to "openai" only after the OPENAI_API_KEY secret exists; OpenAI has
# no free tier, so that path bills your account per token.
#
# Candidates may also bring their own OpenAI-compatible key in the setup form.
# That key is used in-flight only: it is never logged and never stored here.
INTERVIEW_PROVIDER = "workers-ai"
INTERVIEW_TEXT_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
INTERVIEW_STT_MODEL = "@cf/openai/whisper"
# Optional paid models, used only when INTERVIEW_PROVIDER = "openai".
OPENAI_TEXT_MODEL = "gpt-4o-mini"
OPENAI_STT_MODEL = "whisper-1"
OPENAI_TTS_MODEL = "gpt-4o-mini-tts"
OPENAI_TTS_VOICE = "alloy"

# --- Mock Interview: usage and spending protection ---------------------
INTERVIEW_MAX_SESSIONS_PER_DAY = "5"
INTERVIEW_MAX_TURNS_PER_SESSION = "100"
INTERVIEW_MAX_TURNS_PER_DAY = "200"
INTERVIEW_MAX_SESSIONS_PER_DAY_ALL = "50"

