<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Qubiqode - Online Code Editor</title>

    <meta name="description"
          content="Qubiqode is your online coding workspace. Write, test and execute code.">
    <meta name="color-scheme" content="dark light">

    <link rel="icon" type="image/png" sizes="64x64" href="../favicon.png">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">

    <!-- Use the same theme as QA Interview Hub, before the page is painted -->
    <script>
        (function () {
            var theme = "dark";
            try {
                if (localStorage.getItem("qa-hub-theme") === "light") {
                    theme = "light";
                }
            } catch (error) {
                /* storage not available: keep the default */
            }
            document.documentElement.setAttribute("data-theme", theme);

            // Inside the hub the page is shown without its own header and footer
            if (window.self !== window.top) {
                document.documentElement.className += " embedded";
            }
        })();
    </script>

    <link rel="stylesheet" href="css/qubiqode.css">
</head>

<body>

<div class="app-container">

    <!-- Header -->
    <header class="topbar">

        <div class="brand">
            <div class="brand-icon">Q</div>

            <div class="brand-text">
                <h1>Qubiqode</h1>
                <span>YOUR CODE. YOUR SPACE.</span>
            </div>
        </div>

        <div class="header-actions">
            <a href="../index.html" class="hub-link">
                QA Interview Hub
            </a>

            <span class="connection-status">
                <span class="status-dot"></span>
                Online Compiler
            </span>
        </div>

    </header>

    <!-- Main Workspace -->
    <main class="workspace">

        <section class="editor-panel">

            <div class="panel-heading">
                <span>QUBIQODE CODE EDITOR</span>
                <span>POWERED BY ONECOMPILER</span>
            </div>

            <div class="compiler-container">
                <iframe
                        id="onecompiler-editor"
                        title="Qubiqode Online Code Editor"
                        allowfullscreen>
                </iframe>
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <p>Qubiqode · Built for developers and learners</p>
    </footer>

</div>

<script>
    (function () {
        var THEME_KEY = "qa-hub-theme";
        var EDITOR_URL = "https://onecompiler.org/embed/?theme=";
        var editor = document.getElementById("onecompiler-editor");

        function savedTheme() {
            try {
                return localStorage.getItem(THEME_KEY) === "light" ? "light" : "dark";
            } catch (error) {
                return "dark";
            }
        }

        function applyTheme(theme) {
            var value = theme === "light" ? "light" : "dark";

            document.documentElement.setAttribute("data-theme", value);

            // The editor takes its theme from its address,
            // so it is reloaded only when the theme really changes.
            if (editor.getAttribute("src") !== EDITOR_URL + value) {
                editor.setAttribute("src", EDITOR_URL + value);
            }
        }

        applyTheme(savedTheme());

        // Theme changed in the hub (another tab or the page that embeds this one)
        window.addEventListener("storage", function (event) {
            if (event.key === THEME_KEY) {
                applyTheme(savedTheme());
            }
        });

        window.addEventListener("message", function (event) {
            if (event.origin !== window.location.origin) {
                return;
            }

            if (event.data && event.data.type === "qa-hub-theme") {
                applyTheme(event.data.theme);
            }
        });
    })();
</script>

</body>
</html>
