
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Qubiqode - Online Code Editor</title>

    <meta name="description"
          content="Qubiqode is your online coding workspace. Write, test and execute code.">

    <link rel="stylesheet" href="css/qubiqode.css">
</head>

<body>

<div class="app-container">

    <!-- Header -->
    <header class="topbar">

        <div class="brand">
            <div class="brand-icon">Q</div>

            <div class="brand-text">
                <h1>Qubiqode</h1>
                <span>YOUR CODE. YOUR SPACE.</span>
            </div>
        </div>

        <div class="header-actions">
            <a href="../index.html" class="hub-link">
                QA Interview Hub
            </a>

            <span class="connection-status">
                <span class="status-dot"></span>
                Online Compiler
            </span>
        </div>

    </header>

    <!-- Main Workspace -->
    <main class="workspace">

        <section class="editor-panel">

            <div class="panel-heading">
                <span>QUBIQODE CODE EDITOR</span>
                <span>POWERED BY ONECOMPILER</span>
            </div>

            <div class="compiler-container">
                <iframe
                        id="onecompiler-editor"
                        src="https://onecompiler.org/embed/?theme=dark"
                        title="Qubiqode Online Code Editor"
                        width="100%"
                        height="750"
                        allowfullscreen>
                </iframe>
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <p>Qubiqode · Built for developers and learners</p>
    </footer>

</div>

</body>
</html>
